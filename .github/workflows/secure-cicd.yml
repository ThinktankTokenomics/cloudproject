name: TrustGate secure CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Test and scan source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run automated tests
        run: docker run --rm -v "$GITHUB_WORKSPACE:/app" -w /app node:24-alpine npm test

      - name: Check dependency advisories
        run: docker run --rm -v "$GITHUB_WORKSPACE:/app" -w /app node:24-alpine npm audit --audit-level=high

      - name: Scan source for secrets and vulnerable packages
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache" \
            aquasec/trivy:0.76.1 fs \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            /repo

      - name: Check Dockerfile security configuration
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache" \
            aquasec/trivy:0.76.1 config \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            /repo/Dockerfile

      - name: Build a validation image
        run: docker build --pull --build-arg "BUILD_SHA=$GITHUB_SHA" --tag "trustgate-validation:$GITHUB_SHA" .

      - name: Scan validation image before merge
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker save --output "$RUNNER_TEMP/trustgate-validation.tar" "trustgate-validation:$GITHUB_SHA"
          docker run --rm \
            -v "$RUNNER_TEMP:/scan:ro" \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache" \
            aquasec/trivy:0.76.1 image \
            --input /scan/trustgate-validation.tar \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress

  publish:
    name: Scan and publish immutable image
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image_url: ${{ steps.push.outputs.image_url }}
      image_digest: ${{ steps.push.outputs.image_digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare image name
        id: image
        run: |
          REPOSITORY="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "image_repo=ghcr.io/$REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Build container image
        env:
          IMAGE_REPO: ${{ steps.image.outputs.image_repo }}
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: docker build --pull --build-arg "BUILD_SHA=$GITHUB_SHA" --tag "$IMAGE_REPO:$IMAGE_TAG" .

      - name: Scan the exact image that will be published
        env:
          IMAGE_REPO: ${{ steps.image.outputs.image_repo }}
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker save --output "$RUNNER_TEMP/trustgate-image.tar" "$IMAGE_REPO:$IMAGE_TAG"
          docker run --rm \
            -v "$RUNNER_TEMP:/scan:ro" \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache" \
            aquasec/trivy:0.76.1 image \
            --input /scan/trustgate-image.tar \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress

      - name: Sign in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish image and record its SHA-256 digest
        id: push
        env:
          IMAGE_REPO: ${{ steps.image.outputs.image_repo }}
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: |
          set -o pipefail
          PUSH_LOG="$RUNNER_TEMP/docker-push.log"
          docker push "$IMAGE_REPO:$IMAGE_TAG" 2>&1 | tee "$PUSH_LOG"

          IMAGE_DIGEST="$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' "$PUSH_LOG" | tail -n 1)"
          if [ -z "$IMAGE_DIGEST" ]; then
            echo "The registry did not return an image digest." >&2
            exit 1
          fi

          IMAGE_URL="$IMAGE_REPO@$IMAGE_DIGEST"
          docker tag "$IMAGE_REPO:$IMAGE_TAG" "$IMAGE_REPO:main"
          docker push "$IMAGE_REPO:main"

          echo "image_digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "image_url=$IMAGE_URL" >> "$GITHUB_OUTPUT"
          echo "Published immutable image: $IMAGE_URL"

  deploy:
    name: Deploy verified digest to Render
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Deploy the image only when Render is configured
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          IMAGE_URL: ${{ needs.publish.outputs.image_url }}
        run: |
          set -euo pipefail
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "Render secrets are not set. The verified image was published; deployment was skipped."
            exit 0
          fi

          PAYLOAD="$(jq -n --arg imageUrl "$IMAGE_URL" '{imageUrl: $imageUrl}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD"
